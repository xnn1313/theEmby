<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NextEmby · 个人中心</title>
<style>
:root{--bg:#f5f7fa;--card:#fff;--line:#e6eaf2;--txt:#1f2733;--dim:#8a94a8;--acc:#2f6bff;--acc-d:#2057d8;--ok:#16a34a;--bad:#e5484d;--r:12px;--sh:0 1px 3px rgba(16,24,40,.07)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font:14px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif}
header{background:var(--card);border-bottom:1px solid var(--line);padding:14px 24px;display:flex;align-items:center;gap:12px}
header .logo{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,var(--acc),#6a93ff);color:#fff;font-weight:800;font-size:18px;display:flex;align-items:center;justify-content:center}
header h1{font-size:17px;margin:0}
header .dim{color:var(--dim);font-size:12px;margin-left:auto}
main{padding:22px 24px 60px;max-width:760px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:18px 20px;margin-bottom:16px}
.card h2{font-size:15px;margin:0 0 12px}
.dim{color:var(--dim);font-size:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.stat{background:#f7f9fc;border:1px solid var(--line);border-radius:10px;padding:12px 16px}
.stat .v{font-size:22px;font-weight:700}.stat .k{color:var(--dim);font-size:12px}
input{width:100%;border:1px solid var(--line);border-radius:9px;padding:10px 12px;font-size:13px;background:#fff;color:var(--txt);font-family:inherit}
input:focus{outline:2px solid rgba(47,107,255,.25);border-color:var(--acc)}
input.mono{font-family:ui-monospace,Menlo,monospace}
button.act{background:var(--acc);color:#fff;border:0;border-radius:9px;padding:10px 18px;cursor:pointer;font-size:14px;margin-top:10px}
button.act:hover{background:var(--acc-d)}
button.act.ghost{background:#fff;border:1px solid var(--line);color:var(--txt)}
button.act.ghost:hover{background:#f0f3f9}
.mode{display:flex;gap:12px;margin-top:4px}
.mode button{flex:1;padding:14px;border-radius:10px;border:1px solid var(--line);background:#f7f9fc;color:var(--txt);cursor:pointer;font-size:14px}
.mode button.on{border-color:var(--acc);background:#e9f0ff;box-shadow:0 0 0 1px var(--acc)}
.mode small{display:block;color:var(--dim);font-size:12px;margin-top:4px;font-weight:400}
#msg{min-height:22px;font-size:13px;margin-top:8px}
#msg.ok{color:var(--ok)}#msg.bad{color:var(--bad)}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line)}
th{color:var(--dim);font-weight:500}
.mono{font-family:ui-monospace,Menlo,monospace;font-size:12px}
.tag{display:inline-block;padding:2px 10px;border-radius:20px;font-size:12px;background:#eef1f7;color:#5b6478}
.tag.ok{background:#e5f6ec;color:var(--ok)}
.rowline{display:flex;gap:10px;align-items:center}
.rowline input{flex:1}
</style>
</head>
<body>
<header><div class="logo">N</div><h1>个人中心</h1><span class="dim">身份经 ?nb_user= 识别</span></header>
<main>
<div class="card"><h2>我的账号</h2>
<div class="rowline"><input id="uid" class="mono" placeholder="用户ID，如 lzy"><button class="act ghost" style="margin-top:0" onclick="saveUid()">切换用户</button></div>
</div>
<div class="card"><h2>播放模式</h2>
<div class="mode">
<button id="m115" onclick="setMode('115')">用自己的 115<small>秒传进你的 115 网盘，播你盘里的直链</small></button>
<button id="mpool" onclick="setMode('pool')">走分布式池<small>运营方网盘池，注册即用</small></button>
</div>
<div class="dim" style="margin-top:8px">当前：<b id="curMode">-</b></div>
</div>
<div class="card"><h2>我的 115 Cookie</h2>
<p class="dim">从浏览器登录 115 后复制 Cookie（形如 UID=…;CID=…;SEID=…;）。服务端 AES-GCM 加密存储，绝不明文落盘。保存前会做一次登录校验。</p>
<input id="ck" type="password" class="mono" placeholder="粘贴 115 Cookie" autocomplete="off">
<button class="act" onclick="saveCookie()">保存并校验</button>
<div id="msg"></div>
<div class="dim" style="margin-top:8px">状态：<span id="ckState">-</span></div>
</div>
<div class="card"><h2>我的统计</h2><div class="grid" id="stats"></div></div>
<div class="card"><h2>近期播放</h2>
<table><thead><tr><th>时间</th><th>分支</th><th>账号</th><th>耗时ms</th></tr></thead><tbody id="recent"></tbody></table>
</div>
</main>
<script>
'use strict';
let UID=new URLSearchParams(location.search).get('nb_user')||localStorage.getItem('nb_user')||'';
document.getElementById('uid').value=UID;
function saveUid(){UID=document.getElementById('uid').value.trim();localStorage.setItem('nb_user',UID);
 location.search='?nb_user='+encodeURIComponent(UID);}
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const bn={cache_hit:'缓存命中',own_drive_hit:'自有盘命中',p2p_rapid:'用户间秒传',seed_fallback:'源盘兜底',pool_probe_hit:'池探测命中',pool_shield_transfer:'神盾转存',pool_seed_fallback:'池源盘秒传'};
async function api(p,opt){opt=opt||{};const u='/nb/me/api'+p+(p.includes('?')?'&':'?')+'nb_user='+encodeURIComponent(UID);
 const r=await fetch(u,opt);if(!r.ok){const t=await r.text();throw new Error(r.status+': '+t);}return r.json();}
function msg(t,ok){const m=document.getElementById('msg');m.textContent=t;m.className=ok?'ok':'bad';}
async function load(){if(!UID)return;try{const p=await api('/profile');
 document.getElementById('curMode').textContent=p.mode==='115'?'用自己的 115':'走分布式池';
 document.getElementById('m115').classList.toggle('on',p.mode==='115');
 document.getElementById('mpool').classList.toggle('on',p.mode==='pool');
 document.getElementById('ckState').innerHTML=p.hasCookie?'<span class="tag ok">已设置</span>':'<span class="tag">未设置</span>';
 document.getElementById('stats').innerHTML='<div class="stat"><div class="v">'+p.stats.ok+'</div><div class="k">直连成功</div></div><div class="stat"><div class="v">'+p.stats.fail+'</div><div class="k">直连失败</div></div>';
 document.getElementById('recent').innerHTML=(p.recent||[]).map(x=>'<tr><td class="mono">'+esc(x.at)+'</td><td>'+esc(bn[x.branch]||x.branch)+'</td><td class="mono">'+esc(x.accountID)+'</td><td>'+x.elapsedMs+'</td></tr>').join('')||'<tr><td colspan=4 class="dim">暂无</td></tr>';
}catch(e){msg('加载失败：'+e.message,false);}}
async function setMode(m){try{const r=await api('/mode',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({mode:m})});
 msg('已切换为'+(m==='115'?'用自己的 115':'走分布式池')+(r.warn?'（提醒：'+r.warn+'）':''),true);load();}catch(e){msg('切换失败：'+e.message,false);}}
async function saveCookie(){const c=document.getElementById('ck').value.trim();if(!c)return msg('请先粘贴 Cookie',false);
 msg('正在校验登录态…',true);
 try{await api('/cookie',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({cookie:c})});
  document.getElementById('ck').value='';msg('保存成功，Cookie 已加密存储',true);load();}catch(e){msg('保存失败：'+e.message,false);}}
if(UID)load();
</script>
</body>
</html>
