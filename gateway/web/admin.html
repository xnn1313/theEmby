<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NextEmby · 管理后台</title>
<style>
:root{
  --bg:#f5f7fa;--card:#ffffff;--line:#e6eaf2;--txt:#1f2733;--dim:#8a94a8;
  --acc:#2f6bff;--acc-d:#2057d8;--orange:#ff6a00;--ok:#16a34a;--bad:#e5484d;--warn:#b45309;
  --r:12px;--sh:0 1px 3px rgba(16,24,40,.07);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font:14px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif}
/* ---------- layout ---------- */
#app{display:flex;min-height:100vh}
#side{width:224px;flex:0 0 224px;background:var(--card);border-right:1px solid var(--line);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;z-index:30}
.brand{display:flex;align-items:center;gap:10px;padding:18px 18px 14px}
.brand .logo{width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,var(--acc),#6a93ff);color:#fff;font-weight:800;font-size:20px;display:flex;align-items:center;justify-content:center}
.brand b{font-size:16px;display:block;line-height:1.2}
.brand small{color:var(--dim);font-size:11px}
.nav{padding:6px 12px;display:flex;flex-direction:column;gap:4px;flex:1}
.nav a{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;color:var(--txt);text-decoration:none;font-size:14px}
.nav a svg{width:18px;height:18px;flex:0 0 18px}
.nav a:hover{background:#eef2fb}
.nav a.on{background:var(--acc);color:#fff}
.side-ft{padding:14px 18px;border-top:1px solid var(--line);font-size:12px;color:var(--dim)}
.side-ft .conn{display:flex;align-items:center;gap:6px;margin-top:6px;color:var(--txt)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok);display:inline-block}
.dot.bad{background:var(--bad)}
.logout{margin:0 12px 10px;width:calc(100% - 24px)}
#main{flex:1;min-width:0;display:flex;flex-direction:column}
#topbar{position:sticky;top:0;z-index:20;background:var(--card);border-bottom:1px solid var(--line);padding:12px 24px;display:flex;align-items:center;gap:12px}
#topbar h1{font-size:17px;margin:0;flex:1}
#burger{display:none;border:1px solid var(--line);background:#fff;border-radius:8px;width:36px;height:36px;cursor:pointer;font-size:18px;color:var(--txt)}
#view{padding:22px 24px 60px;max-width:1180px;width:100%;margin:0 auto}
/* ---------- cards / common ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:18px 20px;margin-bottom:16px}
.card>h2,.card h3{font-size:15px;margin:0 0 14px}
.card h3{font-size:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:900px){.grid2{grid-template-columns:1fr}}
.rowline{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.muted{color:var(--dim);font-size:12px}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px}
/* ---------- buttons / inputs ---------- */
.btn{background:var(--acc);color:#fff;border:0;border-radius:9px;padding:8px 16px;font-size:13.5px;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--acc-d)}
.btn.ghost{background:#fff;border:1px solid var(--line);color:var(--txt)}
.btn.ghost:hover{background:#f0f3f9}
.btn.orange{background:var(--orange)}
.btn.orange:hover{background:#e05e00}
.btn.danger{background:var(--bad)}
.btn.sm{padding:5px 10px;font-size:12.5px;border-radius:7px}
.btn:disabled{opacity:.55;cursor:default}
input[type=text],input[type=password],input[type=number],input[type=date],select,textarea{border:1px solid var(--line);border-radius:9px;padding:8px 11px;font-size:13.5px;background:#fff;color:var(--txt);font-family:inherit}
input:focus,select:focus,textarea:focus{outline:2px solid rgba(47,107,255,.25);border-color:var(--acc)}
textarea{width:100%;min-height:74px;resize:vertical}
.field{margin-bottom:12px}
.field>label{display:block;font-size:12.5px;color:var(--dim);margin-bottom:5px}
.field input,.field select{width:100%}
.frow{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
/* switch */
.sw{position:relative;display:inline-block;width:40px;height:22px;vertical-align:middle;flex:0 0 auto}
.sw input{opacity:0;width:0;height:0}
.sw span{position:absolute;inset:0;background:#cbd3e1;border-radius:20px;cursor:pointer;transition:.2s}
.sw span:before{content:"";position:absolute;width:16px;height:16px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s;box-shadow:0 1px 2px rgba(0,0,0,.25)}
.sw input:checked+span{background:var(--acc)}
.sw input:checked+span:before{transform:translateX(18px)}
.swrow{display:flex;align-items:center;gap:10px;margin-bottom:12px;font-size:13.5px}
/* ---------- tables ---------- */
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
th{color:var(--dim);font-weight:500;font-size:12.5px;white-space:nowrap}
tr:hover td{background:#fafbfe}
.badge{display:inline-block;padding:2px 10px;border-radius:20px;font-size:12px;background:#eef1f7;color:#5b6478}
.badge.ok{background:#e5f6ec;color:var(--ok)}.badge.bad{background:#fdecec;color:var(--bad)}
.badge.warn{background:#fef3e2;color:var(--warn)}.badge.blue{background:#e7efff;color:var(--acc)}
.badge.gray{background:#eef1f7}
/* ---------- tabs / toolbar ---------- */
.tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.tabs button{border:1px solid var(--line);background:#fff;border-radius:9px;padding:7px 14px;cursor:pointer;font-size:13px;color:var(--txt)}
.tabs button.on{background:var(--acc);border-color:var(--acc);color:#fff}
.toolbar{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.toolbar .sp{flex:1}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:#fff}
.seg button{border:0;background:none;padding:7px 14px;cursor:pointer;font-size:13px;color:var(--dim)}
.seg button.on{background:var(--acc);color:#fff}
/* ---------- stats ---------- */
.statbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:10px 16px;min-width:110px}
.stat .v{font-size:20px;font-weight:700}.stat .k{color:var(--dim);font-size:12px}
.pbar{height:6px;background:#e9edf5;border-radius:4px;overflow:hidden;min-width:90px}
.pbar i{display:block;height:100%;background:var(--acc);border-radius:4px}
/* ---------- modal / toast ---------- */
#modalRoot:empty{display:none}
.m-ov{position:fixed;inset:0;background:rgba(20,28,45,.45);display:flex;align-items:center;justify-content:center;z-index:100;padding:16px}
.m-box{background:#fff;border-radius:14px;width:520px;max-width:100%;max-height:88vh;overflow:auto;box-shadow:0 12px 40px rgba(0,0,0,.18)}
.m-hd{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--line)}
.m-hd b{font-size:15px}
.m-x{border:0;background:none;font-size:16px;cursor:pointer;color:var(--dim)}
.m-bd{padding:16px 18px}
.m-ft{padding:12px 18px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px}
#toasts{position:fixed;right:18px;bottom:18px;z-index:200;display:flex;flex-direction:column;gap:8px;max-width:min(420px,90vw)}
.toast{background:#1f2733;color:#fff;border-radius:10px;padding:10px 16px;font-size:13.5px;box-shadow:0 6px 20px rgba(0,0,0,.2);animation:tin .2s}
.toast.bad{background:#b3261e}.toast.ok{background:#146c2e}
@keyframes tin{from{transform:translateY(8px);opacity:0}}
/* ---------- login ---------- */
#loginView{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#e9efff,#f5f7fa);padding:20px}
.login-card{background:#fff;border-radius:16px;box-shadow:0 10px 36px rgba(31,60,150,.12);width:380px;max-width:100%;padding:34px 32px;text-align:center}
.login-card .logo{width:52px;height:52px;border-radius:14px;background:linear-gradient(135deg,var(--acc),#6a93ff);color:#fff;font-weight:800;font-size:26px;display:flex;align-items:center;justify-content:center;margin:0 auto 12px}
.login-card h2{margin:0 0 4px;font-size:18px}
.login-card p{color:var(--dim);font-size:13px;margin:0 0 18px}
.login-card input{width:100%;margin-bottom:10px;padding:10px 12px}
.login-card .btn{width:100%;padding:10px}
.login-card .link{background:none;border:0;color:var(--acc);cursor:pointer;font-size:12.5px;margin-top:10px}
#loginErr{color:var(--bad);font-size:13px;min-height:20px;margin-top:8px}
/* ---------- charts ---------- */
.donut{width:150px;height:150px}
.donut-bg{fill:none;stroke:#e9edf5;stroke-width:16}
.donut-fg{fill:none;stroke:var(--acc);stroke-width:16;stroke-linecap:round}
.donut-t{font-size:20px;font-weight:700;fill:var(--txt);text-anchor:middle}
.donut-s{font-size:11px;fill:var(--dim);text-anchor:middle;letter-spacing:1px}
.kv{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px dashed #eef1f6;font-size:13px}
.kv:last-child{border-bottom:0}
.kv .k{color:var(--dim)}
.ubar{display:flex;align-items:center;gap:10px;padding:6px 0;font-size:13px}
.ubar .nm{width:170px;flex:0 0 170px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ubar .bar{flex:1;height:10px;background:#eef1f6;border-radius:6px;overflow:hidden}
.ubar .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),#6a93ff)}
.ubar .num{width:170px;flex:0 0 170px;text-align:right;color:var(--dim);font-size:12px}
#tlCanvas{width:100%;height:230px;display:block}
.hidden{display:none!important}
.spin{display:inline-block;width:34px;height:34px;border:3px solid #dfe6f5;border-top-color:var(--acc);border-radius:50%;animation:sp 0.8s linear infinite;margin:30px auto}
@keyframes sp{to{transform:rotate(360deg)}}
.center{text-align:center}
.logrow{display:flex;gap:10px;align-items:baseline;padding:8px 4px;border-bottom:1px solid var(--line);font-size:13px}
.logrow .tm{color:var(--dim);font-size:12px;white-space:nowrap}
.logrow .msg{flex:1;word-break:break-all}
@media(max-width:900px){
  #side{position:fixed;left:0;top:0;transform:translateX(-105%);transition:.22s;box-shadow:0 0 30px rgba(0,0,0,.15)}
  body.nav-open #side{transform:none}
  #burger{display:block}
  #view{padding:16px 14px 60px}
}
</style>
</head>
<body>
<!-- 登录视图 -->
<div id="loginView" class="hidden">
  <div class="login-card">
    <div class="logo">N</div>
    <h2>NextEmby 管理后台</h2>
    <p id="loginSub">请输入管理密码</p>
    <div id="loginFormLogin">
      <input type="password" id="loginPwd" placeholder="管理密码" autocomplete="current-password">
      <button class="btn" id="loginBtn">登 录</button>
    </div>
    <div id="loginFormSetup" class="hidden">
      <input type="password" id="setupPwd" placeholder="设置管理密码（≥4 位）" autocomplete="new-password">
      <input type="password" id="setupPwd2" placeholder="再次输入确认" autocomplete="new-password">
      <button class="btn" id="setupBtn">设置并登录</button>
    </div>
    <div><button class="link" id="loginToggle">首次使用？设置管理密码</button></div>
    <div id="loginErr"></div>
  </div>
</div>
<!-- 主应用 -->
<div id="app" class="hidden">
  <aside id="side">
    <div class="brand"><div class="logo">N</div><div><b>NextEmby</b><small>管理后台</small></div></div>
    <nav class="nav" id="nav">
      <a href="#/console" data-r="console"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>控制台</a>
      <a href="#/users" data-r="users"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.2 3.4-5 6.5-5s5.7 1.8 6.5 5"/><circle cx="17" cy="9" r="2.6"/><path d="M16 15.2c2.6.3 4.6 1.8 5.5 4.3"/></svg>用户管理</a>
      <a href="#/server" data-r="server"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="7" rx="1.5"/><rect x="3" y="13" width="18" height="7" rx="1.5"/><circle cx="7" cy="7.5" r="1" fill="currentColor"/><circle cx="7" cy="16.5" r="1" fill="currentColor"/></svg>服务器配置</a>
      <a href="#/logs" data-r="logs"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h10"/></svg>系统日志</a>
      <a href="#/cache" data-r="cache"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><ellipse cx="12" cy="5.5" rx="8" ry="2.8"/><path d="M4 5.5v6c0 1.5 3.6 2.8 8 2.8s8-1.3 8-2.8v-6"/><path d="M4 11.5v6c0 1.5 3.6 2.8 8 2.8s8-1.3 8-2.8v-6"/></svg>缓存列表</a>
      <a href="#/settings" data-r="settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 0 0-.1-1.2l2-1.5-2-3.4-2.3 1a7 7 0 0 0-2-1.2L14.2 3h-4l-.4 2.7a7 7 0 0 0-2 1.2l-2.3-1-2 3.4 2 1.5A7 7 0 0 0 5 12c0 .4 0 .8.1 1.2l-2 1.5 2 3.4 2.3-1a7 7 0 0 0 2 1.2l.4 2.7h4l.4-2.7a7 7 0 0 0 2-1.2l2.3 1 2-3.4-2-1.5c.1-.4.1-.8.1-1.2z"/></svg>系统设置</a>
    </nav>
    <button class="btn ghost logout" id="logoutBtn">退出登录</button>
    <div class="side-ft">v0.1.0<div class="conn"><span class="dot" id="connDot"></span><span id="connTxt">连接正常</span></div></div>
  </aside>
  <div id="main">
    <header id="topbar">
      <button id="burger" aria-label="菜单">☰</button>
      <h1 id="pageTitle">控制台</h1>
      <div id="topActions" class="rowline"></div>
    </header>
    <main id="view"></main>
  </div>
</div>
<div id="modalRoot"></div>
<div id="toasts"></div>
<script>
'use strict';
/* ================= 基础 ================= */
const API='/nb/admin/api';
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtT=ts=>ts?new Date(ts*1000).toLocaleString('zh-CN',{hour12:false}):'-';
const fmtD=ts=>ts?new Date(ts*1000).toLocaleDateString('zh-CN'):'永不过期';
const dstr=ts=>{if(!ts)return '';const d=new Date(ts*1000);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');};
const toTs=v=>v?Math.floor(new Date(v+'T00:00:00').getTime()/1000):0;
const fmtB=b=>{if(b==null||b==='')return '-';b=+b;if(b<1024)return b+' B';if(b<1048576)return (b/1024).toFixed(1)+' KB';if(b<1073741824)return (b/1048576).toFixed(1)+' MB';return (b/1073741824).toFixed(2)+' GB';};
const state={authed:false,route:'',range:'24h',logCat:'',logTimer:null,users:[],templates:[],accounts:[],pathmaps:[],settings:null};
function toast(msg,type){const t=document.createElement('div');t.className='toast '+(type||'');t.textContent=msg;$('toasts').appendChild(t);setTimeout(()=>{t.style.opacity='0';setTimeout(()=>t.remove(),300);},3200);}
async function api(method,path,body){
  const opt={method:method,credentials:'same-origin',headers:{}};
  if(body!==undefined){opt.headers['Content-Type']='application/json';opt.body=JSON.stringify(body);}
  let r;
  try{r=await fetch(API+path,opt);}
  catch(e){throw new Error('网络错误：'+e.message);}
  if(r.status===401){onUnauth();throw new Error('__unauth__');}
  if(!r.ok){let m='HTTP '+r.status;try{const j=await r.json();m=j.error||j.message||m;}catch(_){try{m=await r.text()||m;}catch(__){}}throw new Error(m);}
  const ct=r.headers.get('content-type')||'';
  return ct.indexOf('json')>=0?r.json():{};
}
function onUnauth(){if(!state.authed)return;state.authed=false;stopLogTimer();showLogin();}
/* ================= 登录 ================= */
let loginMode='login';
function setLoginMode(m){loginMode=m;$('loginFormLogin').classList.toggle('hidden',m!=='login');$('loginFormSetup').classList.toggle('hidden',m!=='setup');
  $('loginSub').textContent=m==='setup'?'首次使用，请设置管理密码':'请输入管理密码';
  $('loginToggle').textContent=m==='setup'?'已有密码？返回登录':'首次使用？设置管理密码';$('loginErr').textContent='';}
function showLogin(){$('app').classList.add('hidden');$('loginView').classList.remove('hidden');document.body.classList.remove('nav-open');
  // 探测是否已设置密码：未设置则直接进入设置密码模式
  fetch(API+'/login/status',{credentials:'same-origin'}).then(r=>{if(r.ok)return r.json();}).then(j=>{if(j)setLoginMode(j.passwordSet?'login':'setup');}).catch(()=>{});
}
function showApp(){$('loginView').classList.add('hidden');$('app').classList.remove('hidden');}
async function doLogin(){
  $('loginErr').textContent='';
  try{
    if(loginMode==='setup'){
      const p1=$('setupPwd').value,p2=$('setupPwd2').value;
      if(!p1||p1.length<4)throw new Error('密码至少 4 位');
      if(p1!==p2)throw new Error('两次输入的密码不一致');
      await api('POST','/login',{new_password:p1});
      $('setupPwd').value='';$('setupPwd2').value='';
    }else{
      const p=$('loginPwd').value;
      if(!p)throw new Error('请输入密码');
      await api('POST','/login',{password:p});
      $('loginPwd').value='';
    }
    setLoginMode('login');
    state.authed=true;showApp();
    if(!location.hash||location.hash==='#/login')location.hash='#/console';
    render();
  }catch(e){
    if(e.message==='__unauth__'){$('loginErr').textContent='密码错误';return;}
    $('loginErr').textContent=e.message;
    if(loginMode==='login'&&/未设置|not set|setup|初始化/i.test(e.message))setLoginMode('setup');
  }
}
/* ================= 路由 ================= */
const TITLES={console:'控制台',users:'用户管理',server:'服务器配置',logs:'系统日志',cache:'缓存列表',settings:'系统设置'};
function curRoute(){const h=(location.hash||'').replace(/^#\/?/,'');return TITLES[h]?h:'console';}
window.addEventListener('hashchange',()=>{document.body.classList.remove('nav-open');render();});
function render(){
  if(!state.authed){showLogin();return;}
  showApp();
  const r=curRoute();state.route=r;
  document.querySelectorAll('#nav a').forEach(a=>a.classList.toggle('on',a.dataset.r===r));
  $('pageTitle').textContent=TITLES[r];
  renderTopActions(r);
  stopLogTimer();
  ({console:pgConsole,users:pgUsers,server:pgServer,logs:pgLogs,cache:pgCache,settings:pgSettings})[r]();
}
function renderTopActions(r){
  const t=$('topActions');t.innerHTML='';
  if(r==='console'){
    const seg=document.createElement('div');seg.className='seg';
    ['24h','7d','30d'].forEach(x=>{const b=document.createElement('button');b.textContent=x;b.className=x===state.range?'on':'';
      b.onclick=()=>{state.range=x;renderTopActions('console');pgConsole();};seg.appendChild(b);});
    t.appendChild(seg);
  }
  if(r==='settings'){
    const b=document.createElement('button');b.className='btn orange';b.textContent='重启系统';
    b.onclick=restartConfirm;t.appendChild(b);
  }
}
function stopLogTimer(){if(state.logTimer){clearInterval(state.logTimer);state.logTimer=null;}}
function loadingHTML(){return '<div class="center"><div class="spin"></div></div>';}
function errHTML(e){return '<div class="card"><p style="color:var(--bad)">加载失败：'+esc(e.message)+'</p><button class="btn ghost" onclick="render()">重试</button></div>';}
/* ================= 弹窗 ================= */
function openModal(title,bodyHTML,okLabel,onSubmit){
  const root=$('modalRoot');
  root.innerHTML='<div class="m-ov"><div class="m-box"><div class="m-hd"><b>'+esc(title)+'</b><button class="m-x" id="mClose">✕</button></div><div class="m-bd">'+bodyHTML+'</div><div class="m-ft"><button class="btn ghost" id="mCancel">取消</button><button class="btn" id="mOk">'+esc(okLabel||'确定')+'</button></div></div></div>';
  const close=()=>{root.innerHTML='';};
  $('mClose').onclick=close;$('mCancel').onclick=close;
  root.querySelector('.m-ov').addEventListener('mousedown',e=>{if(e.target.classList.contains('m-ov'))close();});
  $('mOk').onclick=async()=>{try{const ok=await onSubmit();if(ok!==false)close();}catch(e){toast(e.message,'bad');}};
}
function confirmDlg(msg,okLabel){return new Promise(resolve=>{
  const root=$('modalRoot');
  root.innerHTML='<div class="m-ov"><div class="m-box"><div class="m-hd"><b>请确认</b></div><div class="m-bd"><p>'+esc(msg)+'</p></div><div class="m-ft"><button class="btn ghost" id="mCancel">取消</button><button class="btn danger" id="mOk">'+esc(okLabel||'确定')+'</button></div></div></div>';
  const done=v=>{root.innerHTML='';resolve(v);};
  $('mCancel').onclick=()=>done(false);$('mOk').onclick=()=>done(true);
});}
/* ================= 连接状态 ================= */
async function pingConn(){
  try{await api('GET','/settings?prefix=admin.');$('connDot').classList.remove('bad');$('connTxt').textContent='连接正常';}
  catch(e){if(e.message!=='__unauth__'){$('connDot').classList.add('bad');$('connTxt').textContent='连接异常';}}
}
/* ================= 重启 ================= */
async function restartConfirm(){
  if(!await confirmDlg('确定要重启系统吗？服务将短暂中断后自动恢复。','重启'))return;
  toast('重启中…');
  try{await api('POST','/restart');}
  catch(e){if(e.message==='__unauth__')return;/* 连接中断也继续等待恢复 */}
  let n=0;
  const iv=setInterval(async()=>{
    n++;
    try{await api('GET','/settings?prefix=admin.');clearInterval(iv);toast('系统已恢复','ok');pingConn();if(state.route==='settings')pgSettings();}
    catch(e){if(n>40){clearInterval(iv);toast('等待超时，请手动刷新页面','bad');}}
  },3000);
}
</script>

<script>
'use strict';
/* ================= 控制台 ================= */
function donutSVG(pct,label){
  pct=Math.max(0,Math.min(100,+pct||0));
  const r=54,c=2*Math.PI*r,off=c*(1-pct/100);
  return '<svg viewBox="0 0 140 140" class="donut">'
    +'<circle cx="70" cy="70" r="'+r+'" class="donut-bg"/>'
    +'<circle cx="70" cy="70" r="'+r+'" class="donut-fg" stroke-dasharray="'+c.toFixed(1)+'" stroke-dashoffset="'+off.toFixed(1)+'" transform="rotate(-90 70 70)"/>'
    +'<text x="70" y="68" class="donut-t">'+pct.toFixed(0)+'%</text>'
    +'<text x="70" y="88" class="donut-s">'+esc(label)+'</text></svg>';
}
function statRow(name,st){
  const ok=+st.ok||0,fail=+st.fail||0,tot=ok+fail,p=tot?Math.round(ok/tot*100):0;
  return '<div class="kv"><span class="k">'+esc(name)+'</span><span><b>'+ok+'</b> <span class="muted">SUC</span> · <b>'+fail+'</b> <span class="muted">FAIL</span> · <b style="color:var(--acc)">'+p+'%</b></span></div>';
}
async function pgConsole(){
  const v=$('view');v.innerHTML=loadingHTML();
  let d;
  try{d=await api('GET','/console?range='+state.range);}
  catch(e){v.innerHTML=errHTML(e);return;}
  const t=d.transfer||{ok:0,fail:0},dr=d.direct||{ok:0,fail:0},ck=d.cookie||{ok:0,fail:0};
  v.innerHTML=
  '<div class="grid2">'
  +'<div class="card"><h2>来源与链路</h2><div style="display:flex;gap:18px;align-items:center;flex-wrap:wrap">'
  +donutSVG(d.sourceRate,'SOURCE')
  +'<div style="flex:1;min-width:220px">'+statRow('TRANSFER',t)+statRow('DIRECT',dr)+statRow('COOKIE',ck)+'</div>'
  +'</div></div>'
  +'<div class="card"><h2>系统状态</h2>'
  +'<div class="kv"><span class="k">CPU</span><span><b>'+esc(d.cpu)+'%</b></span></div>'
  +'<div class="kv"><span class="k">内存</span><span><b>'+esc(d.memMB)+'</b> MB</span></div>'
  +'<div class="kv"><span class="k">DOWNLOAD</span><span class="muted">0 MB/s</span></div>'
  +'<div class="kv"><span class="k">UPLOAD</span><span class="muted">0 MB/s</span></div>'
  +'<div class="kv"><span class="k">DISK USED</span><span><b>'+fmtB(d.diskUsed)+'</b> <span class="muted">/ '+fmtB(d.diskTotal)+'</span></span></div>'
  +'</div></div>'
  +'<div class="card"><h2>活跃时间线</h2><canvas id="tlCanvas"></canvas><div id="tlEmpty" class="muted center hidden" style="padding:20px">暂无数据</div></div>'
  +'<div class="card"><h2>UA 统计分析</h2><div id="uaBox"></div></div>';
  drawTimeline($('tlCanvas'),d.timeline||[],state.range);
  const ua=d.uaStats||[];
  $('uaBox').innerHTML=ua.length?ua.map(u=>{
    const p=+u.plays||0,dr2=+u.directs||0;
    const max=Math.max.apply(null,ua.map(x=>+x.plays||0))||1;
    return '<div class="ubar"><span class="nm" title="'+esc(u.name)+'">'+esc(u.name||'(未知)')+'</span>'
      +'<span class="bar"><i style="width:'+Math.round(p/max*100)+'%"></i></span>'
      +'<span class="num">'+p+' 播放 · '+dr2+' 直连</span></div>';
  }).join(''):'<p class="muted">暂无数据</p>';
}
function drawTimeline(cv,data,range){
  const box=$('tlEmpty');
  if(!data||!data.length){cv.classList.add('hidden');box.classList.remove('hidden');return;}
  cv.classList.remove('hidden');box.classList.add('hidden');
  const dpr=window.devicePixelRatio||1,W=cv.clientWidth||600,H=230;
  cv.width=W*dpr;cv.height=H*dpr;
  const x=cv.getContext('2d');x.scale(dpr,dpr);x.clearRect(0,0,W,H);
  const padL=44,padR=12,padT=14,padB=30,w=W-padL-padR,h=H-padT-padB;
  const max=Math.max.apply(null,data.map(p=>+p.plays||0).concat([1]));
  const X=i=>padL+w*i/(data.length-1||1),Y=v=>padT+h*(1-v/max);
  x.strokeStyle='#edf0f6';x.fillStyle='#8a94a8';x.font='11px sans-serif';x.lineWidth=1;
  for(let g=0;g<=4;g++){const gv=max*g/4,y=Y(gv);x.beginPath();x.moveTo(padL,y);x.lineTo(W-padR,y);x.stroke();
    x.textAlign='right';x.fillText(Math.round(gv),padL-8,y+4);}
  const ticks=Math.min(6,data.length);
  x.textAlign='center';
  for(let i=0;i<ticks;i++){const idx=Math.round(i*(data.length-1)/(ticks-1||1));const p=data[idx];if(!p)continue;
    const dt=new Date((+p.t||0)*1000);
    const lab=range==='24h'?String(dt.getHours()).padStart(2,'0')+':'+String(dt.getMinutes()).padStart(2,'0'):(dt.getMonth()+1)+'-'+dt.getDate();
    x.fillText(lab,X(idx),H-10);}
  const grad=x.createLinearGradient(0,padT,0,padT+h);
  grad.addColorStop(0,'rgba(22,163,74,.25)');grad.addColorStop(1,'rgba(22,163,74,.02)');
  x.beginPath();x.moveTo(X(0),Y(data[0].plays||0));
  data.forEach((p,i)=>x.lineTo(X(i),Y(+p.plays||0)));
  x.lineTo(X(data.length-1),padT+h);x.lineTo(X(0),padT+h);x.closePath();x.fillStyle=grad;x.fill();
  x.beginPath();data.forEach((p,i)=>{const px=X(i),py=Y(+p.plays||0);i?x.lineTo(px,py):x.moveTo(px,py);});
  x.strokeStyle='#16a34a';x.lineWidth=2.5;x.lineJoin='round';x.stroke();
}
/* ================= 用户管理 ================= */
async function pgUsers(){
  const v=$('view');v.innerHTML=loadingHTML();
  try{
    const [users,tpls]=await Promise.all([api('GET','/users'),api('GET','/templates')]);
    state.users=users||[];state.templates=tpls||[];
  }catch(e){v.innerHTML=errHTML(e);return;}
  const now=Math.floor(Date.now()/1000);
  const online=state.users.filter(u=>+u.sessions>0).length;
  const abnormal=state.users.filter(u=>u.banned).length;
  const expiring=state.users.filter(u=>+u.expiresAt>0&&+u.expiresAt<now+7*86400).length;
  v.innerHTML=
  '<div class="statbar">'
  +'<div class="stat"><div class="v">'+online+'<span class="muted" style="font-size:14px">/'+state.users.length+'</span></div><div class="k">在线</div></div>'
  +'<div class="stat"><div class="v" style="color:'+(abnormal?'var(--bad)':'inherit')+'">'+abnormal+'</div><div class="k">异常</div></div>'
  +'<div class="stat"><div class="v" style="color:'+(expiring?'var(--warn)':'inherit')+'">'+expiring+'</div><div class="k">即将到期(7天)</div></div>'
  +'<div class="stat"><div class="v">0</div><div class="k">待审核</div></div>'
  +'</div>'
  +'<div class="card"><div class="toolbar">'
  +'<input type="text" id="uSearch" placeholder="搜索用户名…" style="width:220px">'
  +'<span class="sp"></span>'
  +'<button class="btn ghost sm" id="uExport">导出备份</button>'
  +'<button class="btn ghost sm" id="uImport">导入备份</button>'
  +'<input type="file" id="uImportFile" accept="application/json" class="hidden">'
  +'<button class="btn sm" id="uAdd">+ 添加用户</button>'
  +'</div><div style="overflow-x:auto"><table><thead><tr><th>用户名</th><th>到期日期</th><th>网盘状态</th><th>活跃度</th><th>操作</th></tr></thead><tbody id="uBody"></tbody></table></div></div>';
  $('uSearch').oninput=()=>drawUsers($('uSearch').value.trim());
  $('uAdd').onclick=()=>userModal(null);
  $('uExport').onclick=exportBackup;
  $('uImport').onclick=()=>$('uImportFile').click();
  $('uImportFile').onchange=e=>{if(e.target.files[0])importBackup(e.target.files[0]);e.target.value='';};
  drawUsers('');
}
function drawUsers(q){
  const max=Math.max.apply(null,state.users.map(u=>+u.plays30d||0).concat([1]));
  const rows=state.users.filter(u=>!q||String(u.id).toLowerCase().indexOf(q.toLowerCase())>=0);
  $('uBody').innerHTML=rows.map(u=>{
    const p30=+u.plays30d||0;
    return '<tr><td><b>'+esc(u.id)+'</b> <span class="badge blue">'+esc(u.template||'-')+'</span>'
      +(u.banned?' <span class="badge bad">已禁用</span>':'')
      +'<div class="muted mono">'+esc(u.mode||'')+'</div></td>'
      +'<td>'+fmtD(+u.expiresAt)+'</td>'
      +'<td>'+esc(u.drive||'-')+' '+(u.driveOk?'<span class="badge ok">✓</span>':'<span class="badge bad">✗</span>')+'</td>'
      +'<td><div class="rowline"><div class="pbar" style="width:90px"><i style="width:'+Math.round(p30/max*100)+'%"></i></div><span class="muted">'+p30+' 次/30天</span></div>'
      +'<div class="muted" style="max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="'+esc(u.lastUA||'')+'">'+esc(u.lastUA||'-')+'</div></td>'
      +'<td style="white-space:nowrap"><button class="btn ghost sm" data-a="edit" data-id="'+esc(u.id)+'">编辑</button> '
      +'<button class="btn ghost sm" data-a="ban" data-id="'+esc(u.id)+'">'+(u.banned?'启用':'禁用')+'</button> '
      +'<button class="btn ghost sm" data-a="del" data-id="'+esc(u.id)+'" style="color:var(--bad)">删除</button></td></tr>';
  }).join('')||'<tr><td colspan="5" class="muted center">暂无用户</td></tr>';
  $('uBody').querySelectorAll('button').forEach(b=>{b.onclick=()=>userAction(b.dataset.a,b.dataset.id);});
}
async function userAction(a,id){
  const u=state.users.find(x=>String(x.id)===String(id));
  if(a==='edit')return userModal(u);
  if(a==='ban'){
    try{await api('PUT','/users/'+encodeURIComponent(id),{banned:!u.banned});toast(u.banned?'已启用':'已禁用','ok');pgUsers();}
    catch(e){toast(e.message,'bad');}
    return;
  }
  if(a==='del'){
    if(!await confirmDlg('确定删除用户「'+id+'」吗？','删除'))return;
    try{await api('DELETE','/users/'+encodeURIComponent(id));toast('已删除','ok');pgUsers();}
    catch(e){toast(e.message,'bad');}
  }
}
function tplOptions(sel){return state.templates.map(t=>'<option value="'+esc(t.name)+'"'+(t.name===sel?' selected':'')+'>'+esc(t.name)+'</option>').join('');}
function userModal(u){
  const isNew=!u;
  openModal(isNew?'添加用户':'编辑用户 · '+u.id,
    (isNew?'<div class="field"><label>用户名</label><input type="text" id="muId" placeholder="如 zhangsan"></div>':'')
    +'<div class="frow">'
    +'<div class="field"><label>模式</label><select id="muMode"><option value="pool"'+((u&&u.mode)==='pool'?' selected':'')+'>pool · 分布式池</option><option value="115"'+((u&&u.mode)==='115'?' selected':'')+'>115 · 自备网盘</option></select></div>'
    +'<div class="field"><label>模板</label><select id="muTpl">'+tplOptions(u?u.template:(state.templates[0]||{}).name)+'</select></div>'
    +'</div>'
    +'<div class="field"><label>到期日期（留空 = 永不过期）</label><input type="date" id="muExp" value="'+(u?dstr(+u.expiresAt):'')+'"></div>'
    +'<div class="field"><label>备注</label><input type="text" id="muRemark" value="'+esc(u?u.remark:'')+'" placeholder="备注信息"></div>'
    +(isNew?'':'<div class="swrow"><label class="sw"><input type="checkbox" id="muBanned"'+(u.banned?' checked':'')+'><span></span></label>禁用该用户</div>'),
    isNew?'添加':'保存',
    async()=>{
      const body={mode:$('muMode').value,template:$('muTpl').value,expiresAt:toTs($('muExp').value),remark:$('muRemark').value.trim()};
      try{
        if(isNew){const id=$('muId').value.trim();if(!id){toast('请填写用户名','bad');return false;}
          await api('POST','/users',Object.assign({id:id},body));}
        else{body.banned=$('muBanned').checked;await api('PUT','/users/'+encodeURIComponent(u.id),body);}
        toast('已保存','ok');pgUsers();
      }catch(e){toast(e.message,'bad');return false;}
    });
}
async function exportBackup(){
  try{
    const s=await api('GET','/settings?prefix=');
    const data={exportedAt:new Date().toISOString(),users:state.users,templates:state.templates,settings:s};
    const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);
    a.download='nextemby-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href),5000);
    toast('备份已导出','ok');
  }catch(e){toast('导出失败：'+e.message,'bad');}
}
async function importBackup(file){
  let data;
  try{data=JSON.parse(await file.text());}catch(e){toast('文件不是合法 JSON','bad');return;}
  if(!await confirmDlg('将导入备份中的用户 / 模板 / 设置（同名覆盖），继续吗？','导入'))return;
  let okc=0,failc=0;const fails=[];
  const put=(p,b)=>api('PUT',p,b);
  try{
    if(data.settings&&typeof data.settings==='object'){await put('/settings',data.settings);okc++;}
  }catch(e){failc++;fails.push('settings: '+e.message);}
  for(const t of data.templates||[]){
    try{await api('POST','/templates',t);okc++;}
    catch(_){try{await api('PUT','/templates/'+encodeURIComponent(t.name),t);okc++;}catch(e){failc++;fails.push('模板'+t.name+': '+e.message);}}
  }
  for(const u of data.users||[]){
    try{await api('POST','/users',{id:u.id,mode:u.mode,template:u.template,expiresAt:u.expiresAt,remark:u.remark});okc++;}
    catch(_){try{await api('PUT','/users/'+encodeURIComponent(u.id),{mode:u.mode,template:u.template,expiresAt:u.expiresAt,banned:u.banned,remark:u.remark});okc++;}
      catch(e){failc++;fails.push('用户'+u.id+': '+e.message);}}
  }
  toast('导入完成：成功 '+okc+'，失败 '+failc,failc?'bad':'ok');
  if(fails.length)toast('失败项：'+fails.slice(0,3).join('；'),'bad');
  pgUsers();
}
</script>

  +'</tbody></table></div></div>';

  $('seSave').onclick=async()=>{
    try{await api('PUT','/settings',{'emby.addr':$('seAddr').value.trim(),'emby.port':$('sePort').value.trim(),'emby.proxy_port':$('seProxyPort').value.trim(),'emby.web_disabled':$('seWebDis').checked?'1':'0'});
      Object.assign(state.settings,{'emby.addr':$('seAddr').value.trim(),'emby.port':$('sePort').value.trim(),'emby.proxy_port':$('seProxyPort').value.trim(),'emby.web_disabled':$('seWebDis').checked?'1':'0'});
      toast('已保存，重启后生效','ok');}catch(e){toast(e.message,'bad');}};
  $('seedAdd').onclick=()=>acctModal('seed');
  $('poolAdd').onclick=()=>acctModal('pool');
  $('pmAdd').onclick=pmModal;
  v.querySelectorAll('[data-seed-en]').forEach(c=>c.onchange=()=>acctToggle(c.dataset.seedEn,'enabled',c.checked));
  v.querySelectorAll('[data-seed-del]').forEach(b=>b.onclick=()=>acctDel(b.dataset.seedDel));
  v.querySelectorAll('[data-pool-h]').forEach(c=>c.onchange=()=>acctToggle(c.dataset.poolH,'healthy',c.checked));
  v.querySelectorAll('[data-pool-en]').forEach(c=>c.onchange=()=>acctToggle(c.dataset.poolEn,'enabled',c.checked));
  v.querySelectorAll('[data-pool-del]').forEach(b=>b.onclick=()=>acctDel(b.dataset.poolDel));
  v.querySelectorAll('[data-pm-del]').forEach(b=>b.onclick=async()=>{
    if(!await confirmDlg('删除路径映射「'+b.dataset.pmDel+'」？','删除'))return;
    try{await api('DELETE','/pathmaps/'+encodeURIComponent(b.dataset.pmDel));toast('已删除','ok');pgServer();}catch(e){toast(e.message,'bad');}});
}
function acctName(id){const a=(state.accounts||[]).find(x=>String(x.id)===String(id));return a?a.name+'（'+a.id+'）':String(id||'-');}
async function acctToggle(id,field,val){
  try{const b={};b[field]=val;await api('PUT','/accounts/'+encodeURIComponent(id),b);toast('已更新','ok');pgServer();}
  catch(e){toast(e.message,'bad');pgServer();}
}
async function acctDel(id){
  if(!await confirmDlg('确定删除账号「'+id+'」吗？','删除'))return;
  try{await api('DELETE','/accounts/'+encodeURIComponent(id));toast('已删除','ok');pgServer();}
  catch(e){toast(e.message,'bad');}
}
function acctModal(kind){
  const isSeed=kind==='seed';
  openModal(isSeed?'添加 115 存储账号':'添加池账号',
    '<div class="frow"><div class="field"><label>账号 ID</label><input type="text" id="acId" placeholder="如 115大 / 115小1"></div>'
    +'<div class="field"><label>名称</label><input type="text" id="acName" placeholder="显示名称"></div></div>'
    +'<div class="field"><label>115 Cookie（仅发送一次，服务端加密存储）</label><input type="password" id="acCookie" placeholder="粘贴 Cookie" autocomplete="off"></div>'
    +'<div class="frow"><div class="field"><label>UID</label><input type="text" id="acUid" placeholder="115 UID"></div>'
    +(isSeed?'':'<div class="field"><label>最大锁定用户数</label><input type="number" id="acMax" value="4" min="1"></div>')+'</div>'
    +(isSeed?'':'<div class="field"><label>秒传目录（rapidDir）</label><input type="text" id="acRapid" placeholder="如 /最近接收"></div>'),
    '添加',
    async()=>{
      const id=$('acId').value.trim(),name=$('acName').value.trim()||id,cookie=$('acCookie').value;
      if(!id){toast('请填写账号 ID','bad');return false;}
      const body={id:id,name:name,kind:kind,cookie:cookie,uid:$('acUid').value.trim(),enabled:true};
      if(!isSeed){body.maxUsers=+($('acMax').value)||4;body.rapidDir=$('acRapid').value.trim();}
      try{await api('POST','/accounts',body);toast('已添加','ok');pgServer();}
      catch(e){toast(e.message,'bad');return false;}
    });
}
function pmModal(){
  const seeds=(state.accounts||[]).filter(a=>a.kind==='seed');
  if(!seeds.length){toast('请先添加 115 存储账号','bad');return;}
  openModal('添加路径映射',
    '<div class="field"><label>Emby 路径</label><input type="text" id="pmPath" placeholder="如 /data/media/电影"></div>'
    +'<div class="field"><label>绑定账号</label><select id="pmAcct">'+seeds.map(a=>'<option value="'+esc(a.id)+'">'+esc(a.name)+'（'+esc(a.id)+'）</option>').join('')+'</select></div>'
    +'<div class="field"><label>子路径</label><input type="text" id="pmSub" placeholder="账号内的子目录，可空"></div>',
    '添加',
    async()=>{
      const p=$('pmPath').value.trim();
      if(!p){toast('请填写 Emby 路径','bad');return false;}
      try{await api('POST','/pathmaps',{embyPath:p,accountId:$('pmAcct').value,subPath:$('pmSub').value.trim()});toast('已添加','ok');pgServer();}
      catch(e){toast(e.message,'bad');return false;}
    });
}
</script>

<script>
'use strict';
/* ================= 系统日志 ================= */
const LOGCATS={'':'全部','play':'播放','user':'用户','error':'异常','system':'系统'};
async function pgLogs(){
  const v=$('view');
  v.innerHTML='<div class="card"><div class="toolbar"><div class="tabs" id="logTabs" style="margin:0">'
    +Object.keys(LOGCATS).map(k=>'<button data-c="'+k+'" class="'+(k===state.logCat?'on':'')+'">'+LOGCATS[k]+'</button>').join('')
    +'</div><span class="sp"></span><span class="muted">15 秒自动刷新</span><button class="btn ghost sm" id="logClear" style="color:var(--bad)">清空日志</button></div>'
    +'<div id="logList">'+loadingHTML()+'</div></div>';
  $('logTabs').querySelectorAll('button').forEach(b=>b.onclick=()=>{state.logCat=b.dataset.c;
    $('logTabs').querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));loadLogs();});
  $('logClear').onclick=async()=>{
    if(!await confirmDlg('确定清空全部系统日志吗？','清空'))return;
    try{await api('DELETE','/logs');toast('已清空','ok');loadLogs();}catch(e){toast(e.message,'bad');}};
  await loadLogs();
  stopLogTimer();
  state.logTimer=setInterval(()=>loadLogs(true),15000);
}
async function loadLogs(silent){
  const box=$('logList');if(!box)return;
  try{
    const q='/logs?limit=200'+(state.logCat?'&category='+encodeURIComponent(state.logCat):'');
    const list=await api('GET',q);
    const badge={play:'blue',user:'ok',error:'bad',system:'gray'};
    box.innerHTML=(list||[]).map(l=>'<div class="logrow"><span class="badge '+(badge[l.category]||'gray')+'">'+esc(LOGCATS[l.category]||l.category||'-')+'</span>'
      +'<span class="tm">'+fmtT(+l.ts)+'</span><span class="msg">'+esc(l.message)+'</span></div>').join('')
      ||'<p class="muted center">暂无日志</p>';
  }catch(e){
    if(e.message==='__unauth__')return;
    if(!silent)box.innerHTML='<p style="color:var(--bad)">加载失败：'+esc(e.message)+'</p>';
  }
}
/* ================= 缓存列表 ================= */
async function pgCache(){
  const v=$('view');v.innerHTML=loadingHTML();
  let list;
  try{list=await api('GET','/cache');}
  catch(e){v.innerHTML=errHTML(e);return;}
  v.innerHTML='<div class="card"><div class="toolbar"><h2 style="margin:0">缓存列表 <span class="muted">（直链缓存 · 10 分钟 TTL）</span></h2><span class="sp"></span>'
    +'<button class="btn ghost sm" id="cacheClear" style="color:var(--bad)">清空缓存</button></div>'
    +'<div style="overflow-x:auto"><table><thead><tr><th>用户名</th><th>文件名</th><th>网盘UID</th><th>UA</th><th>有效期</th><th>操作</th></tr></thead><tbody>'
    +((list||[]).map(c=>'<tr><td><b>'+esc(c.user)+'</b></td><td style="max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="'+esc(c.filename)+'">'+esc(c.filename)+'</td>'
      +'<td class="mono">'+esc(c.accountUID||'-')+'</td>'
      +'<td class="muted" style="max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="'+esc(c.ua||'')+'">'+esc(c.ua||'-')+'</td>'
      +'<td>'+fmtT(+c.expiresAt)+'</td>'
      +'<td><button class="btn ghost sm" data-cd-u="'+esc(c.user)+'" data-cd-s="'+esc(c.sha1)+'" style="color:var(--bad)">删除</button></td></tr>').join('')
      ||'<tr><td colspan="6" class="muted center">暂无缓存</td></tr>')
    +'</tbody></table></div></div>';
  $('cacheClear').onclick=async()=>{
    if(!await confirmDlg('确定清空全部直链缓存吗？','清空'))return;
    try{await api('DELETE','/cache');toast('已清空','ok');pgCache();}catch(e){toast(e.message,'bad');}};
  v.querySelectorAll('[data-cd-u]').forEach(b=>b.onclick=async()=>{
    try{await api('DELETE','/cache/'+encodeURIComponent(b.dataset.cdU)+'/'+encodeURIComponent(b.dataset.cdS));toast('已删除','ok');pgCache();}
    catch(e){toast(e.message,'bad');}});
}
</script>

<script>
'use strict';
/* ================= 系统设置 ================= */
async function getAllSettings(force){
  if(!state.settings||force)state.settings=Object.assign({},await api('GET','/settings?prefix='));
  return state.settings;
}
const S=k=>(state.settings&&state.settings[k]!=null)?state.settings[k]:'';
const ck1=k=>S(k)==='1';
async function saveSettings(patch,msg){
  await api('PUT','/settings',patch);
  Object.assign(state.settings,patch);
  toast(msg||'已保存','ok');
}
async function pgSettings(){
  const v=$('view');v.innerHTML=loadingHTML();
  let tpls;
  try{await getAllSettings(true);tpls=await api('GET','/templates');state.templates=tpls||[];}
  catch(e){v.innerHTML=errHTML(e);return;}
  const cookieKeys=Object.keys(state.settings).filter(k=>/^admin\./.test(k)&&/cookie/i.test(k));
  // 后端算好的 admin.cookie_bound 为 "1"/"0"；"0" 是字符串 truthy，必须显式排除
  const cookieBound=state.settings['admin.cookie_bound']==='1'||
    cookieKeys.some(k=>{const x=state.settings[k];return x&&x!=='0'&&x!=='false'&&x!=='••••••••'&&x!=='********';});
  const bots=parseBots(S('notify.bots'));
  const defTpl=S('policy.template')||((state.templates[0]||{}).name||'');
  v.innerHTML=
  /* ---- 管理员设置 ---- */
  '<div class="card"><h2>管理员设置</h2>'
  +'<div class="frow"><div class="field"><label>Emby 管理员账号（admin.emby_account）</label><input type="text" id="stEmbyAcct" value="'+esc(S('admin.emby_account'))+'"></div>'
  +'<div class="field"><label>用户资料备份目录（admin.backup_dir）</label><input type="text" id="stBackupDir" value="'+esc(S('admin.backup_dir'))+'"></div></div>'
  +'<div class="field"><label>管理密码（留空则不修改）</label><input type="password" id="stPwd" placeholder="填写新密码则修改" autocomplete="new-password"></div>'
  +'<div class="kv"><span class="k">管理员安全网盘 Cookie 绑定状态</span><span>'+(cookieBound?'<span class="badge ok">已绑定</span>':'<span class="badge gray">未绑定</span>')+'</span></div>'
  +'<div style="margin-top:12px"><button class="btn" id="stAdminSave">保存修改</button></div></div>'
  /* ---- 用户组策略 ---- */
  +'<div class="card"><h2>用户组策略</h2>'
  +'<div class="frow"><div class="field"><label>默认模板（policy.template）</label><select id="stDefTpl">'+state.templates.map(t=>'<option value="'+esc(t.name)+'"'+(t.name===defTpl?' selected':'')+'>'+esc(t.name)+'</option>').join('')+'</select></div>'
  +'<div class="field"><label>编辑模板</label><select id="stEditTpl">'+state.templates.map(t=>'<option value="'+esc(t.name)+'"'+(t.name===defTpl?' selected':'')+'>'+esc(t.name)+'</option>').join('')+'</select></div>'
  +'<div class="field"><label>&nbsp;</label><button class="btn ghost sm" id="stTplNew" style="margin-top:22px">+ 新建模板</button></div></div>'
  +'<div id="tplFields"></div>'
  +'<div class="swrow"><label class="sw"><input type="checkbox" id="stOverclock"'+(ck1('policy.overclock')?' checked':'')+'><span></span></label>超频模式（policy.overclock）</div>'
  +'<button class="btn" id="stTplSave">保存</button></div>'
  /* ---- 用户中心 ---- */
  +'<div class="card"><h2>用户中心</h2>'
  +'<div class="field"><label>联系方式（ui.contact）</label><input type="text" id="stContact" value="'+esc(S('ui.contact'))+'" placeholder="如 TG / 邮箱"></div>'
  +'<div class="swrow"><label class="sw"><input type="checkbox" id="stAllowReg"'+(ck1('ui.allow_register')?' checked':'')+'><span></span></label>开放注册（ui.allow_register）</div>'
  +'<div class="frow"><div class="field"><label style="display:flex;align-items:center;gap:8px"><label class="sw"><input type="checkbox" id="stPortal"'+(ck1('ui.user_portal')?' checked':'')+'><span></span></label>启用用户页（ui.user_portal）</label></div>'
  +'<div class="field"><label>用户页端口（ui.user_port）</label><input type="number" id="stUserPort" value="'+esc(S('ui.user_port'))+'"></div></div>'
  +'<div class="field"><label>Emby 对外地址（ui.public_addr）</label><input type="text" id="stPublicAddr" value="'+esc(S('ui.public_addr'))+'" placeholder="如 https://emby.example.com"></div>'
  +'<div class="field"><label>公告（ui.announce）</label><textarea id="stAnnounce">'+esc(S('ui.announce'))+'</textarea></div>'
  +'<button class="btn" id="stUiSave">保存展示信息</button></div>'
  /* ---- NextFind ---- */
  +'<div class="card"><h2>NextFind</h2>'
  +'<div class="field"><label>服务地址（nextfind.url）</label><input type="text" id="stNfUrl" value="'+esc(S('nextfind.url'))+'" placeholder="如 http://127.0.0.1:8080"></div>'
  +'<div class="field"><label>智能体接口密钥（nextfind.agent_key，当前：'+esc(S('nextfind.agent_key')||'未设置')+'；填写则更新）</label><input type="password" id="stNfKey" placeholder="留空不修改" autocomplete="off"></div>'
  +'<div class="swrow"><label class="sw"><input type="checkbox" id="stShield"'+(ck1('nextfind.shield_mode')?' checked':'')+'><span></span></label>神盾模式（nextfind.shield_mode）</div>'
  +'<div class="kv"><span class="k">配额（nextfind.quota）</span><span>'+esc(S('nextfind.quota')||'-')+'</span></div>'
  +'<div style="margin-top:12px"><button class="btn" id="stNfSave">保存配置</button></div></div>'
  /* ---- 系统通知 ---- */
  +'<div class="card"><h2>系统通知</h2>'
  +'<div class="swrow"><label class="sw"><input type="checkbox" id="stPwdProt"'+(ck1('notify.password_protect')?' checked':'')+'><span></span></label>密码防护（notify.password_protect）</div>'
  +'<h3>机器人列表（notify.bots）</h3><div id="botList"></div>'
  +'<button class="btn ghost sm" id="botAdd">+ 添加机器人</button>'
  +'<div style="margin-top:12px"><button class="btn" id="stNotifySave">保存配置</button></div></div>';

  drawTplFields($('stEditTpl').value);
  $('stEditTpl').onchange=()=>drawTplFields($('stEditTpl').value);
  $('stTplNew').onclick=()=>{
    openModal('新建模板','<div class="field"><label>模板名称</label><input type="text" id="ntName" placeholder="如 vip2"></div>','创建',async()=>{
      const n=$('ntName').value.trim();
      if(!n){toast('请填写模板名称','bad');return false;}
      try{await api('POST','/templates',{name:n,maxConcurrent:1,maxDevices:1,defaultLine:'pool',dailyPlays:0,uidTaskLimit:0,lockHours:24,dailyRapid:0,giftDays:0,expireDeleteDays:0});
        toast('模板「'+n+'」已创建','ok');pgSettings();}
      catch(e){toast(e.message,'bad');return false;}
    });};
  drawBots(bots);
  $('botAdd').onclick=()=>{bots.push({name:'',webhook:''});drawBots(bots);};

  $('stAdminSave').onclick=async()=>{
    try{
      const np=$('stPwd').value;
      if(np){await api('POST','/login',{password:np,change:true});$('stPwd').value='';}
      await saveSettings({'admin.emby_account':$('stEmbyAcct').value.trim(),'admin.backup_dir':$('stBackupDir').value.trim()},np?'已保存，管理密码已修改':'已保存');
    }catch(e){toast(e.message,'bad');}};
  $('stTplSave').onclick=async()=>{
    const name=$('stEditTpl').value;
    const t={name:name};
    ['maxConcurrent','maxDevices','dailyPlays','uidTaskLimit','lockHours','dailyRapid','giftDays','expireDeleteDays'].forEach(k=>{t[k]=+$('tf_'+k).value||0;});
    t.defaultLine=$('tf_defaultLine').value;
    try{
      await api('PUT','/templates/'+encodeURIComponent(name),t);
      await saveSettings({'policy.template':$('stDefTpl').value,'policy.overclock':$('stOverclock').checked?'1':'0'},'模板「'+name+'」已保存');
      const i=state.templates.findIndex(x=>x.name===name);if(i>=0)state.templates[i]=Object.assign({name:name},t);
    }catch(e){toast(e.message,'bad');}};
  $('stUiSave').onclick=async()=>{
    try{await saveSettings({'ui.contact':$('stContact').value.trim(),'ui.allow_register':$('stAllowReg').checked?'1':'0','ui.user_portal':$('stPortal').checked?'1':'0','ui.user_port':$('stUserPort').value.trim(),'ui.public_addr':$('stPublicAddr').value.trim(),'ui.announce':$('stAnnounce').value},'展示信息已保存');}
    catch(e){toast(e.message,'bad');}};
  $('stNfSave').onclick=async()=>{
    try{const p={'nextfind.url':$('stNfUrl').value.trim(),'nextfind.shield_mode':$('stShield').checked?'1':'0'};
      const k=$('stNfKey').value;if(k)p['nextfind.agent_key']=k;
      await saveSettings(p,'NextFind 配置已保存');$('stNfKey').value='';}
    catch(e){toast(e.message,'bad');}};
  $('stNotifySave').onclick=async()=>{
    try{await saveSettings({'notify.password_protect':$('stPwdProt').checked?'1':'0','notify.bots':JSON.stringify(bots)},'通知配置已保存');}
    catch(e){toast(e.message,'bad');}};
}
function drawTplFields(name){
  const t=(state.templates||[]).find(x=>x.name===name)||{};
  const num=(k,lab)=>'<div class="field"><label>'+lab+'</label><input type="number" id="tf_'+k+'" value="'+esc(t[k]==null?'':t[k])+'" min="0"></div>';
  $('tplFields').innerHTML='<div class="frow">'
    +num('maxConcurrent','最大并发数')+num('maxDevices','最大设备数')
    +'<div class="field"><label>默认线路（defaultLine）</label><select id="tf_defaultLine"><option value="self"'+(t.defaultLine==='self'?' selected':'')+'>self · 自备网盘</option><option value="pool"'+(t.defaultLine==='pool'?' selected':'')+'>pool · 分布式池</option></select></div>'
    +num('dailyPlays','每日播放次数')+num('uidTaskLimit','UID 任务上限')+num('lockHours','锁定时长（小时）')
    +num('dailyRapid','每日秒传上限')+num('giftDays','赠送天数')+num('expireDeleteDays','过期删除天数（0=不删）')
    +'</div>';
}
function parseBots(s){
  try{const a=JSON.parse(s||'[]');return Array.isArray(a)?a.map(x=>({name:x.name||'',webhook:x.webhook||''})):[];}
  catch(_){return [];}
}
function drawBots(bots){
  $('botList').innerHTML=bots.map((b,i)=>'<div class="rowline" style="margin-bottom:8px"><input type="text" placeholder="名称" data-bi="'+i+'" data-bf="name" value="'+esc(b.name)+'" style="width:140px">'
    +'<input type="text" placeholder="Webhook 地址" data-bi="'+i+'" data-bf="webhook" value="'+esc(b.webhook)+'" style="flex:1;min-width:200px">'
    +'<button class="btn ghost sm" data-bdel="'+i+'" style="color:var(--bad)">删除</button></div>').join('')
    ||'<p class="muted">暂无机器人</p>';
  $('botList').querySelectorAll('[data-bi]').forEach(inp=>inp.oninput=()=>{bots[+inp.dataset.bi][inp.dataset.bf]=inp.value;});
  $('botList').querySelectorAll('[data-bdel]').forEach(b=>b.onclick=()=>{bots.splice(+b.dataset.bdel,1);drawBots(bots);});
}
/* ================= 启动 ================= */
$('loginBtn').onclick=doLogin;
$('setupBtn').onclick=doLogin;
$('loginToggle').onclick=()=>setLoginMode(loginMode==='login'?'setup':'login');
$('loginPwd').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin();});
$('setupPwd2').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin();});
$('logoutBtn').onclick=async()=>{try{await api('POST','/logout');}catch(_){} state.authed=false;state.settings=null;stopLogTimer();setLoginMode('login');showLogin();};
$('burger').onclick=()=>document.body.classList.toggle('nav-open');
(async function boot(){
  try{await api('GET','/settings?prefix=admin.');state.authed=true;showApp();render();}
  catch(e){if(e.message!=='__unauth__')toast('连接失败：'+e.message,'bad');showLogin();}
  setInterval(pingConn,60000);
})();
</script>
